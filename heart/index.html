<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<title>别猜了，你在TA心里到底算什么？</title>
<style>
:root{
  --bg:#080B10;
  --bg2:#0D121B;
  --panel:#111824;
  --panel2:#0E141E;
  --line:#232C3B;
  --text:#E8EEF6;
  --muted:#8794A8;
  --accent:#7CF5C8;
  --accent2:#6EE7FF;
  --gold:#FFC46B;
  --sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--text);
  font-family:var(--sans);
  background:
    radial-gradient(720px 520px at 12% -4%, rgba(110,231,255,.10), transparent 62%),
    radial-gradient(620px 520px at 92% 18%, rgba(124,245,200,.07), transparent 62%),
    linear-gradient(180deg,#0A0F16 0%,#080B10 55%,#06090D 100%);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(124,245,200,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,245,200,.045) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at 50% 30%, #000 20%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 20%, transparent 78%);
}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:22px 20px 44px}
.screen{display:none}
.screen.on{display:block;animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
button{font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.mono{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hud{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--accent)}
.hud i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 封面 ---------- */
.cover{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;padding:8px 0 30px}
.cover .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:52px}
.cover h1{
  font-size:clamp(36px,9.8vw,46px);line-height:1.28;font-weight:900;letter-spacing:-.04em;
  margin:0 0 18px;
}
.cover h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
.cover h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:.04em;height:.28em;
  background:rgba(124,245,200,.16);z-index:-1;
}
.cover .sub{font-size:15px;color:var(--text);margin:0 0 8px;font-weight:700;letter-spacing:.02em}
.cover .desc{font-size:13.5px;line-height:1.9;color:var(--muted);margin:0;max-width:330px}
.cover .cta{margin-top:38px}
.btn{
  min-height:52px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;font-weight:800;
  letter-spacing:.06em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:0 26px;transition:transform .15s, box-shadow .15s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:#04130D;border-color:var(--accent);box-shadow:0 10px 30px rgba(124,245,200,.16)}
.btn-primary:disabled{background:var(--panel);color:var(--muted);border-color:var(--line);box-shadow:none;cursor:default}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.cover .fine{margin-top:16px;font-size:10px;letter-spacing:.12em;color:var(--muted)}

/* ---------- 关系选择 ---------- */
.page-head{margin:10px 0 24px}
.page-head h2{font-size:26px;line-height:1.35;font-weight:900;letter-spacing:-.03em;margin:14px 0 8px}
.page-head p{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0}
.rel{
  width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;
  padding:16px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);color:var(--text);cursor:pointer;transition:.16s;
}
.rel .rk{
  flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:8px;
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--accent);
  background:var(--panel2);
}
.rel .rt{flex:1;min-width:0}
.rel .rt b{display:block;font-size:14.5px;margin-bottom:4px;letter-spacing:.01em}
.rel .rt span{display:block;font-size:11.5px;line-height:1.7;color:var(--muted)}
.rel.sel{border-color:var(--accent);background:#0F1B1A;box-shadow:0 0 0 1px rgba(124,245,200,.35) inset,0 8px 26px rgba(124,245,200,.07)}
.rel.sel .rk{background:var(--accent);color:#04130D;border-color:var(--accent)}
.rel:active{transform:scale(.995)}

/* ---------- 答题 ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.quiz-top .mono{color:var(--accent)}
.progress{height:6px;border-radius:99px;background:#121A26;overflow:hidden;margin-bottom:26px;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s}
.q-index{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.16em}
.qtext{font-size:20px;line-height:1.6;font-weight:800;letter-spacing:-.01em;margin:0 0 22px}
.qopts{display:flex;flex-direction:column;gap:9px}
.qopt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--text);font-size:14px;line-height:1.6;cursor:pointer;transition:.15s;
}
.qopt .ql{
  flex:0 0 26px;height:26px;border:1px solid var(--line);border-radius:6px;
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--panel2);transition:.15s;
}
.qopt.sel{border-color:var(--accent);background:#0F1B1A;box-shadow:0 0 0 1px rgba(124,245,200,.3) inset}
.qopt.sel .ql{background:var(--accent);color:#04130D;border-color:var(--accent)}
.nav{display:flex;gap:9px;margin-top:22px}
.nav .btn{flex:1}
.nav .btn:disabled{opacity:.28;cursor:default}
.quiz-note{margin-top:14px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted)}

/* ---------- 结果 ---------- */
.report{padding-top:4px}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px}
.rep-kicker{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:0 0 8px;font-family:var(--mono)}
.rep-title{font-size:clamp(26px,6.8vw,34px);line-height:1.4;font-weight:900;letter-spacing:-.03em;margin:0 0 10px}
.rep-title em{font-style:normal;color:var(--seg);text-shadow:0 0 26px var(--segglow)}
.rep-explain{font-size:13px;line-height:1.85;color:var(--muted);margin:0 0 18px}
.techline{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.techline .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.tech{
  display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--seg);color:var(--seg);background:rgba(255,255,255,.02);
  font-weight:900;font-size:15px;letter-spacing:.04em;box-shadow:0 0 22px var(--segglow) inset;
}
.tech::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--seg);box-shadow:0 0 8px var(--seg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.chip.key{border-color:rgba(255,196,107,.4);color:var(--gold);background:rgba(255,196,107,.05)}
.chip.idx{border-color:rgba(110,231,255,.35);color:var(--accent2);background:rgba(110,231,255,.05)}
.subline{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 22px;padding-left:10px;border-left:2px solid var(--seg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);display:block;margin-bottom:8px}
.card p{font-size:13.5px;line-height:1.95;color:var(--text);margin:0}
.combo .name{font-size:18px;font-weight:900;color:var(--seg);margin:2px 0 6px;letter-spacing:.02em}
.combo p{color:var(--muted)}
.analysis h2{font-size:13px;font-family:var(--mono);letter-spacing:.16em;color:var(--accent);margin:26px 0 12px;font-weight:400}
.ev-list{counter-reset:ev;list-style:none;padding:0;margin:0}
.ev-list li{position:relative;padding:11px 0 11px 30px;border-top:1px dashed rgba(255,255,255,.08);font-size:13.5px;line-height:1.7}
.ev-list li:first-child{border-top:none;padding-top:2px}
.ev-list li::before{counter-increment:ev;content:"0" counter(ev);position:absolute;left:0;top:10px;font-family:var(--mono);font-size:10px;color:var(--seg)}
.ev-list li:first-child::before{top:2px}
.disclaimer{font-size:11px;line-height:1.9;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:20px 0 26px}
.share{
  position:relative;width:100%;max-width:360px;margin:0 auto 8px;aspect-ratio:4/5;
  border:1px solid var(--seg);border-radius:18px;overflow:hidden;
  background:linear-gradient(170deg,#0D141E,#080C12);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:34px 26px;text-align:center;
}
.share::before{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:var(--seg);filter:blur(90px);opacity:.14;top:-70px;
}
.share .s-top{position:absolute;top:18px;left:0;right:0;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--muted)}
.share .s-kicker{position:relative;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--seg);margin-bottom:14px}
.share .s-human{position:relative;font-size:21px;line-height:1.5;font-weight:900;letter-spacing:-.01em;margin:0 0 16px}
.share .s-human em{font-style:normal;color:var(--seg)}
.share .s-quote{position:relative;font-size:13px;line-height:1.9;color:var(--text);margin:0;opacity:.9}
.share .s-foot{position:absolute;bottom:18px;left:0;right:0;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted)}
.share-hint{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin:10px 0 24px}
.restart{display:flex;gap:9px}
.restart .btn{flex:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<main class="app">

  <!-- ============ 封面 ============ -->
  <section class="screen on" id="scr-cover">
    <div class="cover">
      <div class="topline">
        <div class="hud"><i></i>PERMISSION SCAN</div>
        <span class="mono">V2.0 / 12Q</span>
      </div>
      <h1>别猜了，<br>你在TA心里<br>到底<em>算什么</em>？</h1>
      <p class="sub">权限与段位质检报告</p>
      <p class="desc">你是TA的唯一、备胎，还是意难平？12题测出你的权限与段位。</p>
      <div class="cta">
        <button class="btn btn-primary btn-block" id="startBtn">开始质检</button>
      </div>
      <p class="fine">12 题 · 约 2 分钟 · 结果仅供娱乐</p>
    </div>
  </section>

  <!-- ============ 关系选择 ============ -->
  <section class="screen" id="scr-rel">
    <div class="page-head">
      <div class="hud"><i></i>STEP 01 / SELECT TARGET</div>
      <h2>你们现在是什么关系？</h2>
      <p>先选一个最接近的，后面的题只针对这段关系。</p>
    </div>
    <div id="relList"></div>
    <button class="btn btn-primary btn-block" id="relNext" disabled style="margin-top:16px">进入质检</button>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen" id="scr-quiz">
    <div class="quiz-top">
      <span class="mono" id="qIdx">第 01 题 / 共 12 题</span>
      <span class="q-index" id="qSeg">QUESTION</span>
    </div>
    <div class="progress"><i id="qBar"></i></div>
    <h2 class="qtext" id="qText"></h2>
    <div class="qopts" id="qOpts"></div>
    <div class="nav">
      <button class="btn btn-ghost" id="prevBtn">上一题</button>
      <button class="btn btn-primary" id="nextBtn">下一题</button>
    </div>
    <p class="quiz-note">未选择不能进入下一题</p>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen" id="scr-result">
    <div id="resultBody"></div>
  </section>

</main>

<script>
/* =========================================================
   题库：关系 → 12 题 × 5 选项（选项顺序固定 A-E）
   选项下标 0-4 对应段位 A-E；每题 evidence 用于结果页
   ========================================================= */

  jia:{
    key:'甲', name:'暗恋/暧昧未确定',

        {t:'完全没发现，等你再找TA时像没事发生', ev:'你停聊两天，TA像没发现。'},
        {t:'突然发一句阴阳怪气/试探的话，又撤回', ev:'TA发一句阴阳话，又撤回。'},
        {t:'在共同群@你，私聊却装没事', ev:'TA在群里@你，私聊装没事。'}
      ]},
      {q:'你暗示“最近有人追你”，TA反应：', o:[
        {t:'明显紧张，追问细节，甚至吃醋', ev:'你一提有人追，TA立刻紧张。'},
        {t:'说“那挺好啊”，转头跟你聊自己的烦恼', ev:'TA说挺好，然后开始讲自己。'},
        {t:'祝你幸福，毫无波澜', ev:'TA祝你幸福，没有多问一句。'},
        {t:'冷脸、消失，或来一句“随便你”', ev:'你一说有人追，TA冷脸消失。'},
        {t:'开玩笑“那我是不是要排队”，但不敢认真', ev:'TA笑问要不要排队，又打哈哈。'}
      ]},
      {q:'你深夜发“今天好累”，TA：', o:[

        {t:'回“早点睡”，第二天也不追问', ev:'TA只回一句早点睡，第二天没问。'},
        {t:'不回，第二天突然发很多条解释', ev:'TA不回，第二天突然发一长串。'},
        {t:'点个赞，私聊一句“你最近怎么了”又收回', ev:'TA点了个赞，话到一半又收回。'}
      ]},
      {q:'你们约好见面，TA临时放鸽子：', o:[
        {t:'认真道歉，并立刻改约明确时间', ev:'TA放你鸽子，但立刻改约。'},
        {t:'道歉后开始讲自己多惨，你反过来安慰TA', ev:'TA迟到，最后变成你安慰TA。'},
        {t:'一句“下次一定”，然后没下次', ev:'TA说下次一定，然后没有下次。'},
        {t:'直接消失，过几天当没发生', ev:'TA放鸽子后消失，回来装没事。'},
        {t:'说“怕见了控制不住”，又打哈哈', ev:'TA说怕见了控制不住，又笑过去。'}
      ]},
      {q:'共同朋友问TA“你俩是不是有事”，TA：', o:[
        {t:'不否认，甚至有点默认', ev:'朋友起哄，TA没有否认。'},
        {t:'说“TA人很好，我什么都能跟TA说”', ev:'TA说“TA人很好，我什么都跟TA说”。'},
        {t:'说“就朋友啊，别乱讲”', ev:'TA赶紧撇清：就朋友，别乱讲。'},

        {t:'笑说“你猜”，然后打听你怎么说', ev:'TA笑说“你猜”，回头打听你怎么说。'}

      {q:'如果明天你突然官宣恋爱，TA最可能：', o:[
        {t:'第一时间来问“真的假的”，明显慌了', ev:'你官宣恋爱，TA第一时间来问。'},
        {t:'祝福你，然后深夜找你倾诉自己孤独', ev:'TA祝福你，深夜却说自己也孤独。'},
        {t:'点个赞就划走', ev:'你官宣，TA只点了个赞。'},
        {t:'把你删了/拉黑/发疯', ev:'你官宣，TA直接把你删了。'},

      ]},
      {q:'你发和其他异性合照，TA：', o:[
        {t:'直接问“你们什么关系”', ev:'你发合照，TA直接问什么关系。'},
        {t:'酸一句，然后开始诉苦自己没人陪', ev:'TA酸你一句，然后说自己没人陪。'},
        {t:'点赞，毫无反应', ev:'你和别人合照，TA毫无反应。'},

      {q:'TA遇到好事，第一时间：', o:[

        {t:'你从朋友圈才知道', ev:'TA的好事，你是从朋友圈知道的。'},

      ]},
      {q:'你拒绝TA一次请求，TA：', o:[
        {t:'怕你不高兴，认真解释', ev:'你拒绝一次，TA认真解释半天。'},
        {t:'说你变了/冷你，等你哄', ev:'你拒绝后，TA冷着你等你哄。'},

/* 题目权重：第12题3；第6、7、9、10题2；其余1 */
function weightOf(i){
  if(i === 11) return 3;
  if([5,6,8,9].includes(i)) return 2;
  return 1;
}

/* =========================================================
   计分
   ========================================================= */
function compute(){
  const qs = BRANCHES[state.branch].qs;
  const scores = {A:0,B:0,C:0,D:0,E:0};
  qs.forEach((q,i)=>{
    const seg = SEG_KEYS[state.answers[i]];
    scores[seg] += weightOf(i);
  });

  const total = SEG_KEYS.reduce((s,k)=>s+scores[k],0);
  const max = Math.max(...SEG_KEYS.map(k=>scores[k]));
  const tied = SEG_KEYS.filter(k=>scores[k]===max);
  const q12 = SEG_KEYS[state.answers[11]];
  let main;
  if(tied.length === 1) main = tied[0];
  else main = tied.includes(q12) ? q12 : tied[0];

  const rest = SEG_KEYS.filter(k=>k!==main);
  const max2 = Math.max(...rest.map(k=>scores[k]));
  const second = rest.find(k=>scores[k]===max2);

  return {scores, total, main, second};
}

function indexTags(sc){
  const total = sc.total || 1;
  const perm = (sc.A + 0.5*sc.E) / total;
  const consume = (sc.B + 1.2*sc.D) / total;
  const late = (sc.E + 0.3*sc.A) / total;
  const lowPri = sc.C / total;
  const conflict = sc.D / total;
  const tags = [];
  if(consume >= 0.40) tags.push('高消耗');
  if(lowPri >= 0.30) tags.push('低优先级明显');
  if(conflict >= 0.30) tags.push('高冲突');
  if(perm >= 0.20 && perm < 0.35) tags.push('权限未激活');
  else if(perm < 0.20) tags.push('低权限');
  if(late >= 0.30) tags.push('高后劲');
  else if(late >= 0.15) tags.push('有后劲未触发');
  if(perm >= 0.35) tags.push('高权限');
  return tags.slice(0,3);
}

function keyTags(sc){
  const seg = i => SEG_KEYS[state.answers[i]];
  const tags = [];
  if(seg(11)==='A' && sc.main!=='A') tags.push('未激活核心');
  if(seg(11)==='E') tags.push('后劲待触发');
  if(['C','D'].includes(seg(5))) tags.push('承诺测试未通过');
  if(['B','C'].includes(seg(8))) tags.push('支持测试不足');
  if(seg(9)==='D') tags.push('边界高风险');
  if(['A','E'].includes(seg(6))) tags.push('失去测试有反应');
  else if(seg(6)==='C') tags.push('失去测试无反应');
  return Array.from(new Set(tags)).slice(0,3);
}

function evidenceLines(main, second){
  const qs = BRANCHES[state.branch].qs;
  const picked = qs.map((q,i)=>({
    seg: SEG_KEYS[state.answers[i]],
    ev: q.o[state.answers[i]].ev
  }));
  const primary = picked.filter(x=>x.seg===main);
  const secondary = picked.filter(x=>x.seg===second);
  const others = picked.filter(x=>x.seg!==main && x.seg!==second);
  const list = [...primary, ...secondary, ...others];
  const out = [];
  for(const x of list){
    if(!out.includes(x.ev)) out.push(x.ev);
    if(out.length === 3) break;
  }
  return out;
}

/* =========================================================
   结果页
   ========================================================= */
function renderResult(){

  const secondSeg = SEGMENTS[sc.second];
  if(sc.main === undefined || sc.second === undefined) return;

  const color = mainSeg.color;
  const glow = color + '40';
  const comboKey = [sc.main, sc.second].sort().join('+');

  const block = mainSeg.blocks[state.branch];
  const idxs = indexTags(sc.scores);
  const keys = keyTags(sc);
  const evs = evidenceLines(sc.main, sc.second);
  const relName = BRANCHES[state.branch].name;

  document.documentElement.style.setProperty('--segglow', glow);

  $('#resultBody').innerHTML = `
    <div class="report">

      </div>

      <p class="subline">副段位｜${secondSeg.tech}：${secondSeg.sub}</p>

      <div class="card combo">
        <span class="lbl">组合模式</span>
        <div class="name">${combo[0]}</div>
        <p>${combo[1]}</p>
      </div>

      <h2 class="analysis-h" style="font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);margin:26px 0 12px;font-weight:400">${relName} · 深度分析</h2>

      <div class="card">
        <span class="lbl">TA真实把你放在什么位置</span>
        <p>${block.pos}</p>
      </div>
      <div class="card">
        <span class="lbl">TA没说出口的心里话</span>
        <p>${block.inner}</p>
      </div>
      <div class="card">
        <span class="lbl">你为什么会觉得不对劲</span>
        <p>${block.unease}</p>
      </div>
      <div class="card">
        <span class="lbl">你的系统标签</span>
        <p>${block.tag}</p>
      </div>
      <div class="card">
        <span class="lbl">给你的权限建议</span>
        <p>${block.advice}</p>
      </div>
      <div class="card">
        <span class="lbl">一句清醒话</span>
        <p style="color:var(--seg)">${block.clear}</p>
      </div>

      <div class="card">
        <span class="lbl">你的质检证据</span>
        <ol class="ev-list">
          ${evs.map(e=>`<li>${e}</li>`).join('')}
        </ol>
      </div>

      <p class="subline">副段位补充｜${secondSeg.tech}：${secondSeg.explain}</p>

      <p class="disclaimer">本报告基于你在这 12 题里的主观选择做推演，不是读心术，也不是对 TA 的判决。关系是两个人共同写的，这份结果只代表此刻你看到的那一面。</p>

      <div class="share">
        <div class="s-top">QC REPORT · PERMISSION &amp; RANK</div>
        <div class="s-kicker">你在TA心里的位置</div>
        <p class="s-human">TA把你当<em>“${mainSeg.human}”</em></p>
        <p class="s-quote">${mainSeg.quote}</p>

  $('#againBtn').addEventListener('click', reset);
  $('#copyBtn').addEventListener('click', ()=>{

/* 复制 */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy'); toast('已复制');}catch(e){}
  document.body.removeChild(ta);
}
let toastTimer;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#7CF5C8;color:#04130D;font:700 11px/1 var(--sans);letter-spacing:.1em;padding:11px 18px;border-radius:99px;opacity:0;transition:.22s;z-index:60;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translate(-50%,0)'; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translate(-50%,16px)'; }, 1600);
}

function reset(){
  state.branch = null;
  state.answers = [];
  state.q = 0;
  show('scr-cover');
}

/* 事件 */
$('#startBtn').addEventListener('click', ()=>{
  renderRel();
  show('scr-rel');
});
$('#relNext').addEventListener('click', ()=>{
  if(!state.branch) return;
  startQuiz();
});

/* 启动 */
renderRel();
</script>
