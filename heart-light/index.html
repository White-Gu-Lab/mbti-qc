<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F9F9">
<title>测测你在TA心里到底算什么？</title>
<style>
:root{
  --bg:#F9F9F9;
  --card:#FFFFFF;
  --ink:#333333;
  --muted:#888888;
  --faint:#B4B4B4;
  --accent:#7A9E9F;
  --rose:#C98D8D;
  --soft:#EFF3F2;
  --soft2:#F6EFEF;
  --line:#EDEDED;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:600px;margin:0 auto;padding:36px 22px 72px}
.hidden{display:none!important}
.screen{animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- cover ---------- */
.kicker{font-size:12px;letter-spacing:.22em;color:var(--faint);margin-bottom:18px}
h1{font-size:30px;line-height:1.4;font-weight:700;margin:0 0 14px;letter-spacing:-.2px}
.sub{font-size:14px;color:var(--muted);margin:0 0 26px}
.lead{font-size:17px;line-height:1.9;margin:0 0 34px}
.lead b{font-weight:600;color:var(--accent)}
.pick-label{font-size:12px;letter-spacing:.18em;color:var(--faint);margin:0 0 14px}
.rel{
  background:var(--card);
  border-radius:16px;
  padding:20px 22px;
  margin:0 0 14px;
  box-shadow:0 4px 20px rgba(0,0,0,.035);
  cursor:pointer;
  transition:box-shadow .2s ease,transform .2s ease;
}
.rel:active{transform:scale(.988)}
.rel:hover{box-shadow:0 8px 26px rgba(0,0,0,.06)}
.rel .rt{font-size:17px;font-weight:600;margin-bottom:4px}
.rel .rh{font-size:13px;color:var(--muted)}
.rel .no{float:right;font-size:12px;color:var(--faint);letter-spacing:.12em;margin-top:4px}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.qnum{font-size:12px;color:var(--faint);letter-spacing:.14em}
.qback{font-size:13px;color:var(--muted);background:none;border:0;padding:6px 0;cursor:pointer;font-family:inherit}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:34px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.qtext{font-size:20px;line-height:1.65;font-weight:600;margin:0 0 26px}
.opt{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);
  border-radius:14px;
  padding:16px 18px;
  margin:0 0 12px;
  font-size:15.5px;
  line-height:1.65;
  cursor:pointer;
  box-shadow:0 3px 14px rgba(0,0,0,.028);
  transition:background .18s ease,box-shadow .18s ease;
}
.opt .k{color:var(--faint);font-size:13px;line-height:1.9;min-width:14px}
.opt.on{background:var(--soft);box-shadow:0 3px 16px rgba(122,158,159,.14)}
.opt.on .k{color:var(--accent)}

/* ---------- result ---------- */
.rlabel{font-size:12px;letter-spacing:.2em;color:var(--faint);margin-bottom:12px}
.rname{font-size:30px;line-height:1.35;font-weight:700;margin:0 0 14px;color:var(--accent)}
.rtag{font-size:17px;line-height:1.85;margin:0 0 34px}
.card{
  background:var(--card);
  border-radius:16px;
  padding:22px 24px;
  margin:0 0 16px;
  box-shadow:0 4px 20px rgba(0,0,0,.035);
}
.card h3{font-size:12px;letter-spacing:.18em;color:var(--faint);font-weight:500;margin:0 0 12px}
.card p{margin:0;font-size:15.5px;line-height:1.85}
.card.advice{background:var(--soft2)}
.card.advice p{color:#7d5b5b}
.card.hide-state{background:var(--soft)}
.card.hide-state .hname{font-size:16px;font-weight:600;margin:0 0 8px;color:var(--accent)}
.card.hide-state p{font-size:15px}
.lbl-sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.btn{
  display:block;width:100%;
  background:var(--accent);color:#fff;
  border:0;border-radius:999px;
  padding:16px;font-size:15px;font-family:inherit;
  letter-spacing:.06em;cursor:pointer;
  margin:30px 0 0;
}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:12px}
.foot{margin-top:34px;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

  <!-- 封面 -->
  <section id="cover" class="screen">
    <div class="kicker">情感自测</div>
    <h1>测测你在TA心里<br>到底算什么？</h1>
    <p class="sub">暗恋、恋爱、失恋、拉扯都能测，15题看清你的真实位置。</p>
    <p class="lead">别猜了，选第一直觉，<br>看看你在TA那里<b>到底排第几</b>。</p>
    <p class="pick-label">先选一个，你们现在的关系</p>
    <div id="rels"></div>
    <p class="foot">测试仅供娱乐。爱自己，才是终身浪漫的开始。</p>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen hidden">
    <div class="qtop">
      <span class="qnum" id="qnum">01 / 15</span>
      <button class="qback" id="qback">上一题</button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <h2 class="qtext" id="qtext"></h2>
    <div id="opts"></div>
  </section>

  <!-- 结果 -->
  <section id="result" class="screen hidden">
    <div class="rlabel">你的结果</div>
    <h2 class="rname" id="rname"></h2>
    <p class="rtag" id="rtag"></p>
    <div class="card"><h3>TA 的真实心理</h3><p id="rpsy"></p></div>
    <div class="card"><h3>你的现状</h3><p id="rself"></p></div>
    <div class="card hide-state hidden" id="hcard">
      <h3>你的隐藏状态</h3>
      <p class="hname" id="hname"></p>
      <p class="lbl-sub" id="htag"></p>
      <p id="hpsy"></p>
    </div>
    <div class="card advice"><h3>写在最后</h3><p id="radvice"></p></div>
    <button class="btn" id="again">再测一次</button>
    <button class="btn ghost" id="copy">复制结果</button>
    <p class="foot">测试仅供娱乐。爱自己，才是终身浪漫的开始。</p>
  </section>

</div>

<script>

const LETTERS = ['A','B','C','D','E'];
const KEYS = ['A','B','C','D','E'];
const WEIGHT = i => i === 14 ? 3 : ([1,5,6,7,9].indexOf(i) >= 0 ? 2 : 1);

let branch = null, idx = 0, answers = [];

const $ = id => document.getElementById(id);
const show = id => {
  ['cover','quiz','result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
};

function renderRels() {
  $('rels').innerHTML = DATA.rel.map((r, i) =>
    '<div class="rel" data-k="' + r.key + '"><span class="no">0' + (i+1) + '</span>' +
    '<div class="rt">' + r.title + '</div><div class="rh">' + r.hint + '</div></div>'
  ).join('');
  document.querySelectorAll('.rel').forEach(el => el.addEventListener('click', () => start(el.dataset.k)));
}

function start(k) {
  branch = k; idx = 0; answers = [];
  show('quiz');
  renderQ();
}

function renderQ() {
  const qs = DATA.branches[branch].qs;
  const q = qs[idx];
  $('qnum').textContent = String(idx + 1).padStart(2, '0') + ' / ' + qs.length;
  $('barfill').style.width = ((idx) / qs.length * 100) + '%';
  $('qtext').textContent = q.q;
  $('qback').style.visibility = idx === 0 ? 'hidden' : 'visible';
  const chosen = answers[idx];
  $('opts').innerHTML = q.o.map((t, i) =>
    '<div class="opt' + (chosen === i ? ' on' : '') + '" data-i="' + i + '">' +
    '<span class="k">' + LETTERS[i] + '</span><span>' + t + '</span></div>'
  ).join('');
  document.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => pick(+el.dataset.i)));
}

function pick(i) {
  answers[idx] = i;
  document.querySelectorAll('.opt').forEach(el => el.classList.toggle('on', +el.dataset.i === i));
  setTimeout(() => {
    if (idx < DATA.branches[branch].qs.length - 1) { idx++; renderQ(); window.scrollTo(0, 0); }
    else finish();
  }, 230);
}

function finish() {
  const score = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  answers.forEach((a, i) => { if (a >= 0) score[KEYS[a]] += WEIGHT(i); });
  const list = Object.keys(score).map(k => ({ k, s: score[k] })).sort((x, y) => y.s - x.s);
  const top = list[0].s, second = list[1].s;
  const tied = list.filter(x => x.s === top);
  const winner = tied.length > 1 ? KEYS[answers[14]] : list[0].k;
  const runner = list.find(x => x.k !== winner);

  const R = DATA.results[winner];
  $('rname').textContent = R.name;
  $('rtag').textContent = R.tag;
  $('rpsy').textContent = R.b[branch].psy;
  $('rself').textContent = R.b[branch].self;
  $('radvice').textContent = R.advice;

  if (second !== undefined && (top - second) <= 3 && runner) {
    const S = DATA.results[runner.k];
    $('hcard').classList.remove('hidden');
    $('hname').textContent = S.name;
    $('htag').textContent = S.tag;
    $('hpsy').textContent = S.b[branch].psy;
  } else {
    $('hcard').classList.add('hidden');
  }
  window.__lastResult = R.name + '\n' + R.tag + '\n\n' + R.b[branch].psy + '\n\n' + R.b[branch].self;
  show('result');
}

renderRels();
$('qback').addEventListener('click', () => {
  if (idx > 0) { idx--; renderQ(); window.scrollTo(0, 0); }
});
$('again').addEventListener('click', () => { branch = null; idx = 0; answers = []; show('cover'); });
$('copy').addEventListener('click', async () => {
  const text = (window.__lastResult || '') + '\n\n—— 测测你在TA心里到底算什么？';
  try { await navigator.clipboard.writeText(text); $('copy').textContent = '已复制'; }
  catch (e) { $('copy').textContent = '复制失败'; }
  setTimeout(() => $('copy').textContent = '复制结果', 1600);
});
</script>
