<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>他到底怎么看你？· 星盘缘分测试</title>
<style>
:root{
  --bg1:#0E0B1A;
  --bg2:#1A1230;
  --card:rgba(30,23,51,.75);
  --line:rgba(255,255,255,.08);
  --accent:#B8A6FF;
  --gold:#FFD9A0;
  --text:#E8E4F5;
  --muted:#8E86A8;
  --tc:#C9A6FF;
  --tcg:rgba(201,166,255,.35);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(160deg,#0E0B1A 0%,#1A1230 58%,#120D22 100%);
  color:var(--text);
  font-family:var(--sans);
  font-weight:300;
  line-height:1.8;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 18% 8%, rgba(126,84,226,.26), transparent 62%),
    radial-gradient(520px 520px at 88% 32%, rgba(52,74,186,.22), transparent 62%),
    radial-gradient(640px 520px at 46% 104%, rgba(148,92,200,.16), transparent 66%);
}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--delay)}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.75;transform:scale(1)}}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:22px 20px 42px}
.screen{display:none}
.screen.on{display:block;animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
button{font-family:var(--sans);-webkit-tap-highlight-color:transparent}

/* ---------- 封面 ---------- */
.cover{
  min-height:calc(100vh - 90px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10px 0 30px;
}
.zrow{
  display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(4px,1.5vw,9px);
  color:var(--accent);opacity:.66;
  font-size:clamp(13px,3.4vw,17px);
  margin-bottom:36px;letter-spacing:.04em;
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2",var(--serif);
}
.cover h1{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(34px,9.6vw,44px);line-height:1.35;letter-spacing:.02em;
  margin:0 0 18px;
  background:linear-gradient(115deg,#FFE4BC 0%,#FFD9A0 30%,#D9C7FF 68%,#B8A6FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(201,166,255,.22));
}
.cover .sub{font-size:14px;line-height:2;color:var(--muted);margin:0;max-width:320px}
.btn-start{
  margin:36px auto 0;min-height:52px;padding:0 48px;border-radius:999px;
  border:1px solid rgba(184,166,255,.62);background:rgba(184,166,255,.08);
  color:var(--accent);font-size:15px;letter-spacing:.18em;
  box-shadow:0 0 26px rgba(184,166,255,.18), inset 0 0 18px rgba(184,166,255,.07);
  cursor:pointer;transition:transform .18s, background .18s;
}
.btn-start:active{transform:scale(.98);background:rgba(184,166,255,.16)}
.cover .fine{margin-top:22px;font-size:11px;letter-spacing:.12em;color:var(--muted);opacity:.8}

/* ---------- 信息收集 ---------- */
.info-top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.back{
  width:44px;height:44px;flex:0 0 auto;border:none;background:transparent;
  color:var(--muted);font-size:18px;cursor:pointer;border-radius:50%;
}
.back:active{background:rgba(255,255,255,.05)}
.steps{flex:1;display:flex;gap:6px}
.steps i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .3s,box-shadow .3s}
.steps i.done{background:var(--accent);box-shadow:0 0 9px rgba(184,166,255,.55)}
.step-no{font-size:10.5px;letter-spacing:.12em;color:var(--muted);min-width:34px;text-align:right}
.step-title{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.5;margin:0 0 8px;letter-spacing:.01em}
.step-sub{font-size:12.5px;color:var(--muted);margin:0 0 24px}
.opt-card{
  width:100%;min-height:56px;text-align:left;padding:14px 16px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text);font-size:15px;font-weight:300;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:border-color .18s, background .18s, box-shadow .18s;
}
.opt-card:active{transform:scale(.995)}
.opt-card.sel{border-color:rgba(184,166,255,.68);background:rgba(184,166,255,.1);box-shadow:0 0 18px rgba(184,166,255,.13)}
.opt-card .tick{color:var(--gold);opacity:0;font-size:12px}
.opt-card.sel .tick{opacity:1}
.zlabel{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-size:12.5px;color:var(--text);letter-spacing:.04em}
.zlabel span{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zcell{
  min-height:62px;border:1px solid var(--line);background:rgba(30,23,51,.62);
  border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;transition:border-color .16s, background .16s, box-shadow .16s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.zsym{font-family:"Segoe UI Symbol","Noto Sans Symbols 2",var(--serif);font-size:19px;line-height:1.2;color:var(--muted);transition:color .16s}
.zname{font-size:10px;letter-spacing:.04em;color:var(--muted);transition:color .16s}
.zcell.sel{border-color:rgba(184,166,255,.72);background:rgba(184,166,255,.12);box-shadow:0 0 16px rgba(184,166,255,.14)}
.zcell.sel .zsym{color:var(--gold)}
.zcell.sel .zname{color:var(--text)}
.zcell.unknown .zsym{font-size:15px}
.btn-next{
  width:100%;min-height:50px;margin-top:26px;border-radius:999px;
  border:1px solid rgba(184,166,255,.6);background:rgba(184,166,255,.1);
  color:var(--accent);font-size:15px;letter-spacing:.12em;cursor:pointer;
  transition:opacity .2s, background .2s;
}
.btn-next:active{background:rgba(184,166,255,.18)}
.btn-next[disabled]{opacity:.3;cursor:default;background:rgba(184,166,255,.04)}

/* ---------- 答题 ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.qbar{height:2px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden;margin-bottom:36px}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s ease}
.qwrap{transition:opacity .22s ease, transform .22s ease}
.qwrap.out{opacity:0;transform:translateY(-10px)}
.qtext{font-family:var(--serif);font-size:21px;line-height:1.6;font-weight:500;letter-spacing:.01em;margin:0 0 28px}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{
  display:flex;align-items:center;gap:13px;min-height:58px;padding:12px 15px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text);font-size:14.5px;line-height:1.55;text-align:left;cursor:pointer;
  transition:border-color .16s, background .16s, box-shadow .16s;
}
.qopt:active{transform:scale(.995)}
.qopt.sel{border-color:rgba(184,166,255,.7);background:rgba(184,166,255,.1);box-shadow:0 0 18px rgba(184,166,255,.13)}
.qletter{
  width:28px;height:28px;flex:0 0 auto;border:1px solid rgba(255,255,255,.18);border-radius:50%;
  display:grid;place-items:center;font-size:11px;letter-spacing:.04em;color:var(--muted);transition:.16s;
}
.qopt.sel .qletter{border-color:var(--accent);color:var(--accent)}
.qtext-main{flex:1}
.qstar{flex:0 0 auto;color:var(--gold);font-size:12px;opacity:0;transition:opacity .16s}
.qopt.sel .qstar{opacity:1}

/* ---------- 计算 ---------- */
.calc-wrap{min-height:calc(100vh - 130px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.astro{width:176px;height:176px;opacity:.82;margin-bottom:40px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc-line{font-family:var(--serif);font-size:15px;color:var(--muted);letter-spacing:.06em;margin:5px 0;opacity:0;animation:calcIn .9s ease forwards}
.l1{animation-delay:.25s}.l2{animation-delay:1s}.l3{animation-delay:1.75s}
@keyframes calcIn{to{opacity:1}}

/* ---------- 结果 ---------- */
.result{text-align:center;padding-top:6px}
.rtype{
  font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.05em;
  color:var(--tc);text-shadow:0 0 28px var(--tcg);margin:6px 0 12px;
}
.rpill{
  display:inline-block;font-size:10.5px;letter-spacing:.14em;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:4px 13px;margin-bottom:28px;
}
.ring-wrap{position:relative;width:170px;height:170px;margin:0 auto 4px}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:46px;color:var(--gold);
  text-shadow:0 0 22px rgba(255,217,160,.35);letter-spacing:.02em;
}
.ring-fg{transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}
.ring-cap{font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:28px}
.tone{
  font-family:var(--serif);font-size:17px;line-height:1.95;color:var(--tc);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:18px 6px;margin:0 0 28px;text-align:center;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 18px 17px;margin-bottom:13px;text-align:left;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.card h3{
  font-size:10.5px;font-weight:400;letter-spacing:.18em;color:var(--gold);
  margin:0 0 9px;display:flex;align-items:center;gap:8px;
}
.card h3::before{content:"✦";font-size:9px;color:var(--tc)}
.card p{font-size:14px;line-height:1.95;color:var(--text);margin:0;font-weight:300}
.share{
  position:relative;width:min(100%,360px);aspect-ratio:4/5;margin:26px auto 10px;
  border:1px solid var(--tc);border-radius:18px;overflow:hidden;
  background:linear-gradient(170deg,rgba(20,15,36,.97),rgba(11,8,22,.99));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 26px;text-align:center;
}
.share::before{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  background:var(--tc);filter:blur(90px);opacity:.16;top:-70px;
}
.share .sname{position:relative;font-size:10.5px;letter-spacing:.24em;color:var(--tc);margin-bottom:20px}
.share .sq{position:relative;font-family:var(--serif);font-size:19px;line-height:1.95;color:var(--text);margin:0;letter-spacing:.02em}
.share .sf{position:absolute;bottom:18px;left:0;right:0;font-size:9px;letter-spacing:.16em;color:var(--muted)}
.share-hint{text-align:center;font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin:2px 0 28px}
.hook{text-align:center;font-size:11.5px;line-height:1.95;color:var(--muted);margin:0 0 26px}
.btn-again{
  display:block;width:100%;min-height:50px;border-radius:999px;
  border:1px solid rgba(184,166,255,.45);background:transparent;
  color:var(--accent);font-size:14px;letter-spacing:.14em;cursor:pointer;
  transition:background .2s;
}
.btn-again:active{background:rgba(184,166,255,.1)}
.reveal{opacity:0;animation:fadeUp .72s cubic-bezier(.2,.7,.3,1) forwards}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<main class="app">

  <!-- ============ 封面 ============ -->
  <section class="screen on" id="scr-cover">
    <div class="cover">
      <div class="zrow" id="zrow"></div>
      <h1>他到底怎么看你？</h1>
      <p class="sub">输入你知道的关于他的那一点信息<br>看看你们之间，是宿命牵绊还是露水情缘</p>
      <button class="btn-start" id="startBtn">开 始 测 试</button>
      <p class="fine">约 3 分钟 · 12 道题 · 基于星盘逻辑推演</p>
    </div>
  </section>

  <!-- ============ 信息收集 ============ -->
  <section class="screen" id="scr-info">
    <div class="info-top">
      <button class="back" id="infoBack" aria-label="返回">←</button>
      <div class="steps"><i></i><i></i><i></i></div>
      <span class="step-no" id="stepNo">1 / 3</span>
    </div>
    <div id="stepBody"></div>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen" id="scr-quiz">
    <div class="quiz-top">
      <span id="qIdx">第 1 题 / 共 12 题</span>
      <span>凭第一感觉</span>
    </div>
    <div class="qbar"><i id="qbarFill"></i></div>
    <div class="qwrap" id="qwrap">
      <h2 class="qtext" id="qtext"></h2>
      <div class="qopts" id="qopts"></div>
    </div>
  </section>

  <!-- ============ 计算 ============ -->
  <section class="screen" id="scr-calc">
    <div class="calc-wrap">
      <svg class="astro" viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke="rgba(184,166,255,.55)" stroke-width="1">
          <circle cx="100" cy="100" r="86"/>
          <circle cx="100" cy="100" r="66" opacity=".7"/>
          <circle cx="100" cy="100" r="30" opacity=".5"/>
          <path d="M100 14 V186 M14 100 H186" opacity=".35"/>
          <path d="M39 39 L161 161 M161 39 L39 161" opacity=".22"/>
        </g>
        <g stroke="rgba(255,217,160,.7)" stroke-width="1.4" stroke-linecap="round">
          <path d="M100 14 v8"/><path d="M100 178 v8"/><path d="M14 100 h8"/><path d="M178 100 h8"/>
          <path d="M139 20 l-4 7"/><path d="M180 61 l-7 4"/>
          <path d="M180 139 l-7 -4"/><path d="M139 180 l-4 -7"/>
          <path d="M61 180 l4 -7"/><path d="M20 139 l7 -4"/>
          <path d="M20 61 l7 4"/><path d="M61 20 l4 7"/>
        </g>
      </svg>
      <p class="calc-line l1">正在读取你们的星座链接…</p>
      <p class="calc-line l2">正在比对行星落点…</p>
      <p class="calc-line l3">正在计算缘分深度…</p>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen" id="scr-result">
    <div id="resultBody"></div>
  </section>

</main>

<script>
/* =========================================================
   数据
   ========================================================= */
const ZODIAC = [
  {key:'aries',     name:'白羊', sym:'♈', el:'fire'},
  {key:'taurus',    name:'金牛', sym:'♉', el:'earth'},
  {key:'gemini',    name:'双子', sym:'♊', el:'air'},
  {key:'cancer',    name:'巨蟹', sym:'♋', el:'water'},
  {key:'leo',       name:'狮子', sym:'♌', el:'fire'},
  {key:'virgo',     name:'处女', sym:'♍', el:'earth'},
  {key:'libra',     name:'天秤', sym:'♎', el:'air'},
  {key:'scorpio',   name:'天蝎', sym:'♏', el:'water'},
  {key:'sagittarius',name:'射手',sym:'♐', el:'fire'},
  {key:'capricorn', name:'摩羯', sym:'♑', el:'earth'},
  {key:'aquarius',  name:'水瓶', sym:'♒', el:'air'},
  {key:'pisces',    name:'双鱼', sym:'♓', el:'water'}
];

const STATUS_OPTS = ['暗恋','暧昧','crush','刚分开','失去联系'];

const BIRTH_OPTS = [
  {label:'完整年月日', v:2},
  {label:'只知道星座', v:1},
  {label:'大概月份',  v:1},
  {label:'完全不知道', v:0}
];

const QUESTIONS = [
  {q:'你们第一次有交集，是怎么开始的？', opts:[
    {t:'自然而然就认识了，好像本来就该认识', tag:'NorthNode', w:3},
    {t:'一方主动搭话/制造机会', tag:'Mars/Sun', w:2},
    {t:'通过朋友/场合被动认识', tag:'Moon/Venus', w:1},
    {t:'记不清了，很模糊', tag:'Neptune', w:1}
  ]},
  {q:'和他相处时，你最常有的感觉是？', opts:[
    {t:'很熟悉，像认识了很久', tag:'SunMoon', w:3},
    {t:'心跳加速，有点紧张', tag:'Venus/Mars', w:2},
    {t:'舒服但平静，没什么波澜', tag:'MoonVenus', w:1},
    {t:'说不上来，就是放不下', tag:'Pluto', w:1}
  ]},
  {q:'你们之间有没有过“只有你们俩懂”的默契？', opts:[
    {t:'有，而且很明显', tag:'Mercury/Moon', w:3},
    {t:'有过一两次', tag:'Mercury', w:2},
    {t:'好像有，但不确定', tag:'Neptune', w:1},
    {t:'没有', tag:'Weak', w:0}
  ]},
  {q:'如果你们断了联系，你觉得他会？', opts:[
    {t:'会主动找我', tag:'Sun/Mars', w:3},
    {t:'可能会，但不一定', tag:'Moon/Venus', w:2},
    {t:'大概率不会', tag:'Saturn/Uranus', w:1},
    {t:'我不知道，也不敢想', tag:'Pluto/Neptune', w:0}
  ]},
  {q:'他有没有夸过你，或者对你表达过欣赏？', opts:[
    {t:'经常，而且很具体', tag:'VenusStrong', w:3},
    {t:'偶尔，比较含蓄', tag:'VenusMid', w:2},
    {t:'几乎没有', tag:'VenusWeak', w:0},
    {t:'他用行动代替语言', tag:'Mars/Moon', w:2}
  ]},
  {q:'你们聊天时，谁更容易“上头”？', opts:[
    {t:'他更主动/更热情', tag:'HisMars/Sun', w:3},
    {t:'我更主动', tag:'MyVenus/Mars', w:1},
    {t:'差不多，互相拉扯', tag:'MutualVenusMars', w:3},
    {t:'都很克制', tag:'Saturn', w:0}
  ]},
  {q:'他有没有做过让你觉得“他是不是也有点意思”的事？', opts:[
    {t:'有，而且不止一次', tag:'VenusMarsMutual', w:3},
    {t:'有过，但很模糊', tag:'Neptune/Moon', w:1},
    {t:'我觉得是我多想', tag:'Neptune/12th', w:0},
    {t:'完全没有', tag:'Weak', w:0}
  ]},
  {q:'你们现在最大的障碍是？', opts:[
    {t:'我不敢开口/不敢推进', tag:'Saturn', w:2},
    {t:'他忽冷忽热，我摸不透', tag:'Uranus/Pluto', w:2},
    {t:'时机不对，错过了', tag:'Saturn/NorthNode', w:3},
    {t:'已经断了，但放不下', tag:'Pluto/12th', w:1}
  ]},
  {q:'你发消息给他，通常多久回？', opts:[
    {t:'很快，基本秒回', tag:'Mars/Mercury', w:3},
    {t:'几小时内', tag:'Normal', w:2},
    {t:'隔天/看心情', tag:'Uranus/Saturn', w:1},
    {t:'经常不回', tag:'Weak/Saturn', w:0}
  ]},
  {q:'你们之间有没有“明明很近却隔着一层”的感觉？', opts:[
    {t:'经常有', tag:'Saturn/Neptune', w:2},
    {t:'偶尔', tag:'SaturnLight', w:1},
    {t:'没有，很自然', tag:'Smooth', w:3},
    {t:'说不清', tag:'Neptune', w:1}
  ]},
  {q:'你每天会想起他几次？', opts:[
    {t:'几乎一直', tag:'MoonVenusStrong', w:3},
    {t:'一天几次', tag:'MoonVenusMid', w:2},
    {t:'偶尔', tag:'Light', w:1},
    {t:'尽量不想', tag:'SaturnAvoid', w:0}
  ]},
  {q:'如果他现在给你一个明确的答案，你会？', opts:[

      if(side === 'my'){

        $$('#myGrid .zcell', body).forEach(c=>c.classList.toggle('sel', c.dataset.key===key));

function startQuiz(){
  state.answers = [];
  state.q = 0;
  state.busy = false;
  show('scr-quiz');
  renderQuestion();
}

function renderQuestion(){
  const i = state.q;
  const q = QUESTIONS[i];
  $('#qIdx').textContent = `第 ${i+1} 题 / 共 12 题`;
  $('#qbarFill').style.width = ((i+1) / QUESTIONS.length * 100) + '%';
  $('#qtext').textContent = q.q;
  $('#qopts').innerHTML = q.opts.map((o,idx)=>`
    <button class="qopt" data-i="${idx}">
      <span class="qletter">${'ABCD'[idx]}</span>
      <span class="qtext-main">${o.t}</span>
      <span class="qstar">✦</span>
    </button>`).join('');
  $$('.qopt').forEach(btn=>{
    btn.addEventListener('click', ()=>choose(parseInt(btn.dataset.i,10), btn));
  });
}

function choose(idx, btn){
  if(state.busy) return;
  state.busy = true;
  btn.classList.add('sel');
  state.answers[state.q] = idx;
  setTimeout(()=>{
    const wrap = $('#qwrap');
    wrap.classList.add('out');
    setTimeout(()=>{
      state.busy = false;
      if(state.q < QUESTIONS.length - 1){
        state.q++;
        renderQuestion();
        void wrap.offsetWidth;
        wrap.classList.remove('out');
      } else {
        startCalc();
      }
    }, 230);
  }, 280);
}

/* =========================================================
   计算
   ========================================================= */
function elementScore(a, b){
  if(!a || !b || a === 'unknown' || b === 'unknown') return 50;
  const za = ZODIAC.find(z=>z.key===a), zb = ZODIAC.find(z=>z.key===b);
  if(!za || !zb) return 50;
  if(za.el === zb.el) return 85;
  const pair = [za.el, zb.el].sort().join('-');
  if(pair === 'air-fire' || pair === 'earth-water') return 78;
  if(pair === 'earth-fire' || pair === 'air-water') return 62;
  return 55;
}

function blockerSuffix(){
  const planets = {Saturn:-1, Uranus:-1, Pluto:-1, Neptune:-1};
  [7,8,9].forEach(qi=>{
    const opt = QUESTIONS[qi].opts[state.answers[qi]];
    if(!opt) return;
    opt.tag.split('/').forEach(tok=>{
      let key = null;
      if(tok.indexOf('Saturn') === 0) key = 'Saturn';
      else if(tok.indexOf('Uranus') === 0) key = 'Uranus';
      else if(tok.indexOf('Pluto') === 0) key = 'Pluto';
      else if(tok.indexOf('Neptune') === 0) key = 'Neptune';
      if(key && opt.w > planets[key]) planets[key] = opt.w;
    });
  });
  let best = 'Saturn', bw = -1;
  ['Saturn','Uranus','Pluto','Neptune'].forEach(p=>{
    if(planets[p] > bw){ bw = planets[p]; best = p; }
  });
  return SUFFIX[best];
}

function computeResult(){
  const w = i => QUESTIONS[i].opts[state.answers[i]] ? QUESTIONS[i].opts[state.answers[i]].w : 0;
  const dimA = w(0)+w(1)+w(2)+w(3);
  const dimB = w(4)+w(5)+w(6);
  const dimC = w(7)+w(8)+w(9);
  const dimD = w(10)+w(11);

  const linkScore = (dimA/12)*60 + (dimB/9)*40;
  const elemScore = elementScore(state.myZodiac, state.hisZodiac);
  let score = Math.round(linkScore * 0.7 + elemScore * 0.3);
  score = Math.max(0, Math.min(100, score));

  const type = TYPES.find(t=> score >= t.min && score <= t.max) || TYPES[TYPES.length-1];
  return {dimA, dimB, dimC, dimD, linkScore, elemScore, score, type, blocker: blockerSuffix()};
}

function startCalc(){
  show('scr-calc');
  setTimeout(()=>{
    const r = computeResult();
    renderResult(r);
    show('scr-result');
  }, 2800);
}

/* =========================================================
   结果
   ========================================================= */
function renderResult(r){
  const t = r.type;
  const C = 2 * Math.PI * 64;
  document.documentElement.style.setProperty('--tc', t.color);
  document.documentElement.style.setProperty('--tcg', t.color + '55');

  $('#resultBody').innerHTML = `
    <div class="result">
      <h1 class="rtype reveal" style="animation-delay:.05s">${t.name}</h1>
      <div class="rpill reveal" style="animation-delay:.12s">${r.blocker}</div>

      <div class="ring-wrap reveal" style="animation-delay:.2s">
        <svg viewBox="0 0 160 160">
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFEFD6"/>
              <stop offset="50%" stop-color="#FFD9A0"/>
              <stop offset="100%" stop-color="#E2AE5F"/>
            </linearGradient>
          </defs>
          <circle cx="80" cy="80" r="64" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"/>
          <circle id="ringFg" class="ring-fg" cx="80" cy="80" r="64" fill="none"
            stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"
            transform="rotate(-90 80 80)"/>
        </svg>
        <div class="ring-num">${r.score}</div>
      </div>
      <div class="ring-cap reveal" style="animation-delay:.26s">缘分链接深度</div>

      <p class="tone reveal" style="animation-delay:.32s">${t.tone}</p>

      <div class="card reveal" style="animation-delay:.46s">
        <h3>你们的链接点</h3><p>${t.linkPoint}</p>
      </div>
      <div class="card reveal" style="animation-delay:.61s">
        <h3>卡住你们的东西</h3><p>${t.blockPoint}</p>
      </div>
      <div class="card reveal" style="animation-delay:.76s">
        <h3>给你的话</h3><p>${t.advice}</p>
      </div>

      <div class="share reveal" style="animation-delay:.92s">
        <div class="sname">${t.name}</div>
        <p class="sq">${t.shareQuote}</p>
        <div class="sf">星盘缘分测试 · 他到底怎么看你</div>
      </div>
      <p class="share-hint">截图保存，分享给懂你的人</p>

      <p class="hook">以上基于你提供的信息做简化推演<br>如果你有他准确的出生时间，可解锁完整合盘</p>
      <button class="btn-again" id="againBtn">重 新 测 试</button>
    </div>`;

  const fg = $('#ringFg');
  const target = C * (1 - r.score / 100);
  requestAnimationFrame(()=>{
    setTimeout(()=>{ fg.style.strokeDashoffset = target.toFixed(1); }, 120);
  });

  $('#againBtn').addEventListener('click', reset);
}

/* =========================================================
   重置与事件
   ========================================================= */
function reset(){
  state.status = null;
  state.precision = 0;
  state.myZodiac = null;
  state.hisZodiac = null;
  state.answers = [];
  state.step = 1;
  state.q = 0;
  state.busy = false;
  show('scr-cover');
}

$('#startBtn').addEventListener('click', ()=>{
  state.step = 1;
  show('scr-info');
  renderInfo();
});

$('#infoBack').addEventListener('click', ()=>{
  if(state.step === 1){ show('scr-cover'); return; }
  state.step--;
  renderInfo();
});

/* 启动 */
renderInfo();
</script>
</body>
</html>
