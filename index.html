<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBTI 出厂检验室 · 你的 MBTI 是原装的吗</title>
<style>
:root{
  --ink:#16130f;
  --ink2:#5d564a;
  --paper:#FDFCF7;
  --card:#FFFFFF;
  --accent:#6B4FB3;
  --accent-d:#4C3385;
  --tint:#E8E0F5;
  --on:#ffffff;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Courier New",monospace;
  --sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Source Han Serif SC","Songti SC","STSong",SimSun,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(rgba(22,19,15,.055) 1px, transparent 1px);
  background-size:6px 6px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent);color:var(--on)}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px clamp(16px,4vw,34px);
  border-bottom:2px solid var(--ink);
  background:var(--card);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}
.topmeta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 壳 ---------- */
.wrap{max-width:820px;margin:0 auto;padding:clamp(20px,4.8vw,44px) clamp(15px,4vw,28px) 86px}
.screen{display:none}
.screen.on{display:block;animation:rise .42s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:0}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);flex:0 0 auto}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink2)}

/* ---------- 选择页 ---------- */
.pick-head h1{font-size:clamp(32px,6.4vw,50px);line-height:1.08;letter-spacing:-.035em;font-weight:900;margin:16px 0 10px}
.pick-head .sub{color:var(--ink2);font-size:14.5px;line-height:1.7;margin:0}
.gblock{
  --g:var(--accent);--tg:var(--tint);--og:var(--on);
  position:relative;border:2px dashed var(--ink);border-radius:20px;
  background:var(--tg);padding:14px;margin-top:20px;
}
.gblock::after{
  content:"";position:absolute;inset:6px;border:1px dashed rgba(22,19,15,.18);
  border-radius:15px;pointer-events:none;
}
.ghead{display:flex;align-items:center;gap:9px;margin:4px 4px 12px;position:relative;z-index:1}
.gkey{
  font-family:var(--mono);font-weight:700;font-size:11.5px;letter-spacing:.06em;
  padding:3px 8px;border-radius:6px;background:var(--g);color:var(--og);
  border:2px solid var(--ink);
}
.gname{font-weight:900;font-size:16px}
.gnote{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;position:relative;z-index:1}
@media (max-width:620px){.grid4{grid-template-columns:repeat(2,1fr)}}
.tcard{
  background:var(--card);border:2px solid var(--ink);border-radius:14px;
  padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;
  cursor:pointer;box-shadow:3px 3px 0 var(--ink);
  transition:transform .14s ease, box-shadow .14s ease;
  font-family:var(--sans);color:var(--ink);
}
.tcard:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.tcard:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.tcard svg{width:100%;max-width:90px;height:auto;display:block}
.tcode{font-weight:900;font-size:15px;letter-spacing:.02em;margin-top:3px}
.tnick{font-size:11px;font-weight:700;color:var(--g)}
.treal{font-size:9.5px;color:var(--ink2);letter-spacing:.02em}
.pick-foot{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink2);text-align:center;margin-top:26px}

/* ---------- 答题页 ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.linkbtn{background:none;border:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink2);cursor:pointer;padding:5px 0}
.linkbtn:hover{color:var(--ink);text-decoration:underline}
.progress{height:9px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card);margin-bottom:22px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .38s cubic-bezier(.2,.8,.25,1)}
.q-card{border:2px dashed var(--ink);border-radius:20px;background:var(--card);padding:clamp(18px,4vw,30px);box-shadow:8px 8px 0 var(--ink)}
.q-no{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink2);margin:0 0 10px}
.q-title{font-size:clamp(19px,4.2vw,26px);line-height:1.5;font-weight:900;letter-spacing:-.01em;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  padding:13px 14px;border:2px solid var(--ink);border-radius:12px;
  background:var(--card);font-family:var(--sans);font-size:14.5px;line-height:1.55;
  cursor:pointer;color:var(--ink);transition:background .13s, transform .13s, box-shadow .13s;
}
.opt:hover{background:var(--tint);transform:translateX(3px)}
.opt.sel{background:var(--tint);box-shadow:2px 2px 0 var(--ink)}
.ob{
  flex:0 0 28px;height:28px;border:2px solid var(--ink);border-radius:8px;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;
  background:var(--card);transition:background .13s,color .13s;
}
.opt.sel .ob{background:var(--accent);color:var(--on)}
.quiz-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink2);text-align:center;margin-top:20px}

/* ---------- 结果页 ---------- */
.res-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:26px}
.res-head h2{font-size:clamp(24px,4.8vw,36px);letter-spacing:-.03em;margin:10px 0 0;font-weight:900;line-height:1.2}
#posters{display:flex;flex-direction:column;gap:26px}

.poster{
  position:relative;max-width:560px;width:100%;margin:0 auto;
  border:2px dashed var(--ink);border-radius:22px;background:var(--card);
  box-shadow:9px 9px 0 var(--ink);padding:24px;
}
.poster::before{
  content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:104px;height:24px;background:rgba(255,255,255,.72);
  border:1px dashed rgba(22,19,15,.3);border-radius:2px;
}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.phead .eyebrow{font-size:9.5px}

/* 第一屏 */
.hero{overflow:hidden;padding-top:24px}
.hero-band{
  margin:-24px -24px 18px;padding:18px 24px 10px;
  background:var(--tint);border-bottom:2px dashed var(--ink);
  border-radius:20px 20px 0 0;
}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-top .mono{font-size:9px;color:var(--ink2)}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin-top:10px}
.hero-code{font-size:clamp(52px,13vw,80px);line-height:.88;letter-spacing:-.055em;font-weight:900}
.hero-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink2);margin-top:7px}
.hero-fig{width:clamp(112px,29vw,168px);flex:0 0 auto;margin-right:-4px;margin-bottom:-14px}
.hero-fig svg{width:100%;height:auto;display:block}
.hero-ver{padding-top:2px}
.hero-pre{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink2);margin:0 0 2px}
.hero-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero-name{
  font-size:clamp(40px,10vw,62px);line-height:1.06;letter-spacing:-.045em;
  font-weight:900;margin:0;display:inline-block;
}
.hero-name mark{
  background:var(--tint);color:var(--ink);padding:0 .07em;border-radius:5px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.hero-def{margin:10px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink2)}
.stamp{
  flex:0 0 auto;transform:rotate(-11deg);
  border:3px double var(--accent-d);color:var(--accent-d);
  padding:5px 9px 4px;border-radius:7px;text-align:center;
  font-weight:900;font-size:13px;line-height:1.08;letter-spacing:.14em;
  opacity:.78;background:rgba(255,255,255,.18);
}
.stamp small{display:block;font-family:var(--mono);font-size:6.5px;letter-spacing:.16em;margin-top:2px}
.hero-quote{
  margin:16px 0 16px;padding:14px 16px;
  border:2px dashed var(--ink);border-radius:12px;background:#FFFDF6;
  font-family:var(--serif);font-size:14.5px;line-height:1.85;letter-spacing:.005em;
}
.hero-foot{display:flex;align-items:flex-end;gap:12px}
.barcode{
  flex:1;height:36px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,
    var(--ink) 0 2px, transparent 2px 4px,
    var(--ink) 4px 5px, transparent 5px 9px,
    var(--ink) 9px 12px, transparent 12px 14px,
    var(--ink) 14px 15px, transparent 15px 19px);
  opacity:.88;
}

/* 第二屏 */
.dim-list{display:flex;flex-direction:column}
.dim-row{display:grid;grid-template-columns:52px 1fr;gap:13px;padding:15px 0;border-top:1.5px dashed rgba(22,19,15,.3)}
.dim-row:first-child{border-top:none;padding-top:2px}
.dim-letter{
  width:52px;height:52px;border:2px solid var(--ink);border-radius:12px;
  display:grid;place-items:center;font-weight:900;font-size:24px;
  background:var(--tint);
}
.dim-main{min-width:0}
.dim-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dim-name{font-weight:900;font-size:14px;line-height:1.5}
.pill{
  flex:0 0 auto;font-family:var(--mono);font-size:9px;letter-spacing:.03em;
  border:2px solid var(--ink);border-radius:99px;padding:2px 8px;white-space:nowrap;margin-top:1px;
}
.pill.lv0{background:var(--ink);color:var(--card)}
.pill.lv1{background:var(--tint);color:var(--ink)}
.pill.lv2{background:repeating-linear-gradient(45deg,var(--tint) 0 4px,#fff 4px 8px);color:var(--ink)}
.pill.lv3{background:var(--accent-d);color:var(--on)}
.dim-diag{font-size:12px;line-height:1.65;color:var(--ink2);margin:6px 0 0}
.dim-bar{display:flex;gap:3px;margin-top:8px}
.dim-bar i{width:22px;height:6px;border:1px solid var(--ink);border-radius:2px}
.dim-bar i.on{background:var(--accent);border-color:var(--accent)}
.conclusion{
  margin:16px 0 0;padding:13px 14px;border:2px dashed var(--ink);border-radius:12px;
  background:var(--tint);font-size:12.5px;line-height:1.85;
}
.conclusion b{font-weight:900;font-size:15px}
.nw{white-space:nowrap}

/* 第三屏 */
.dark{
  background:#17140f;color:#F5EEDD;border-color:#17140f;box-shadow:9px 9px 0 var(--ink);
}
.dark .eyebrow{color:rgba(245,238,221,.62)}
.dark .eyebrow::before{background:var(--accent)}
.dark .mono{color:rgba(245,238,221,.5)}
.insight{
  font-family:var(--serif);font-size:clamp(16.5px,3.4vw,20.5px);line-height:1.95;
  margin:8px 0 24px;letter-spacing:.008em;
}
.insight::first-letter{color:var(--accent);font-size:1.35em;font-weight:700}
.dark-foot{display:flex;justify-content:space-between;border-top:1px dashed rgba(245,238,221,.28);padding-top:11px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:rgba(245,238,221,.55)}

/* 第四屏 */
.cap-text{font-size:clamp(15px,2.7vw,17px);line-height:1.9;font-weight:700;margin:8px 0 20px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.cap-hint{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink2);margin:12px 0 0;text-align:center}

/* 按钮 */
.btn{
  font-family:var(--sans);font-weight:900;font-size:14.5px;
  padding:13px 18px;border:2px solid var(--ink);border-radius:12px;
  background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-primary{background:var(--accent);color:var(--on)}

/* 扫描遮罩 */
.scan{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(253,252,247,.94);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scan.on{opacity:1;pointer-events:auto}
.scan-card{
  width:min(300px,84vw);border:2px dashed var(--ink);border-radius:20px;
  background:var(--card);padding:24px 24px 26px;text-align:center;
  box-shadow:8px 8px 0 var(--ink);position:relative;overflow:hidden;
}
.scan-figure{position:relative;display:inline-block}
.scan-figure svg{width:126px;height:auto;display:block;margin:0 auto}
.scan-beam{
  position:absolute;left:0;right:0;height:3px;top:0;background:var(--accent);
  box-shadow:0 0 14px 3px var(--accent);animation:beam 1.1s ease-in-out infinite;
}
@keyframes beam{0%,100%{top:8%;opacity:.9}50%{top:88%;opacity:.55}}
.scan-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink);margin:14px 0 10px}
.scan-track{height:7px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.scan-track i{display:block;height:100%;width:0;background:var(--accent);animation:fill 1.15s cubic-bezier(.3,.9,.4,1) forwards}
@keyframes fill{to{width:100%}}

/* 提示 */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;padding:10px 18px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.24s;z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{max-width:820px;margin:0 auto;padding:0 24px 40px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#9a927f}

@media (max-width:430px){
  .poster{padding:20px 18px 18px;border-radius:18px;box-shadow:6px 6px 0 var(--ink)}
  .hero-band{margin:-20px -18px 16px;padding:16px 18px 10px}
  .stamp{font-size:12px;padding:4px 7px}
  .hero-quote{font-size:14px;padding:12px 14px}
  .dim-row{grid-template-columns:46px 1fr;gap:10px}
  .dim-letter{width:46px;height:46px;font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> MBTI 出厂检验室</div>
  <div class="topmeta">QC · 11 QUESTIONS · VOL.02</div>
</header>

<main class="wrap">

  <!-- ============ STEP 01 选择 ============ -->
  <section class="screen on" id="s-pick">
    <div class="pick-head">
      <p class="eyebrow">STEP 01 / 选择类型</p>
      <h1>先选你的 MBTI</h1>
      <p class="sub">只选类型，不用解释。选错了也不影响——反正都要验。</p>
    </div>
    <div id="groups"></div>
    <p class="pick-foot">11 题 · 约 2 分钟 · 凭第一反应</p>
  </section>

  <!-- ============ STEP 02 答题 ============ -->
  <section class="screen" id="s-quiz">
    <div class="quiz-top">
      <button class="linkbtn" id="quitBtn">← 重选类型</button>
      <span class="mono" id="qCount">01 / 11</span>
    </div>
    <div class="progress"><span id="qBar"></span></div>
    <div class="q-card">
      <p class="q-no" id="qNo">QUESTION 01</p>
      <h2 class="q-title" id="qTitle"></h2>
      <div class="opts" id="qOpts"></div>
    </div>
    <p class="quiz-note">凭第一反应选 · 不用想太久</p>
  </section>

  <!-- ============ STEP 03 结果 ============ -->
  <section class="screen" id="s-result">
    <div class="res-head">
      <div>
        <p class="eyebrow">STEP 03 / 验货结果</p>
        <h2 id="resTitle">验货完成</h2>
      </div>
    </div>
    <div id="posters"></div>
  </section>

</main>

<footer class="foot">本测试仅供娱乐 · 所有结论都是一种观察，不是判决</footer>

<div class="scan" id="scan" aria-hidden="true">
  <div class="scan-card">
    <div class="scan-figure">
      <div id="scanFig"></div>
      <div class="scan-beam"></div>
    </div>
    <p class="scan-label">INSPECTING · 四维拆解中</p>
    <div class="scan-track"><i></i></div>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
/* =========================================================
   基础数据
   ========================================================= */
const GROUPS = {
  NT:{key:'NT', cn:'分析家', color:'#6B4FB3', dark:'#4C3385', tint:'#E8E0F5', on:'#ffffff', note:'战略 · 系统 · 理性'},
  NF:{key:'NF', cn:'外交家', color:'#2E8B6B', dark:'#1E654B', tint:'#E0F2E8', on:'#ffffff', note:'共情 · 理想 · 意义'},
  SJ:{key:'SJ', cn:'守护者', color:'#2F6FB2', dark:'#1E4E80', tint:'#E0EAF5', on:'#ffffff', note:'秩序 · 责任 · 稳定'},
  SP:{key:'SP', cn:'探险家', color:'#C08A16', dark:'#7E5806', tint:'#F5F0E0', on:'#16130f', note:'现场 · 体验 · 自由'}
};

const TYPES = {
  INTJ:{group:'NT', cn:'建筑师', traits:['独处充电','看长远和可能','逻辑优先','计划驱动']},
  INTP:{group:'NT', cn:'逻辑学家', traits:['独处思考','好奇抽象','分析拆解','灵活随性']},
  ENTJ:{group:'NT', cn:'指挥官', traits:['主动掌控','看战略大局','效率果断','目标驱动']},
  ENTP:{group:'NT', cn:'辩论家', traits:['享受碰撞','联想跳跃','逻辑挑战','多线程切换']},
  INFJ:{group:'NF', cn:'提倡者', traits:['深度独处','洞察本质','共情优先','内在秩序']},
  INFP:{group:'NF', cn:'调停者', traits:['内省独处','理想想象','真实敏感','随性自由']},
  ENFJ:{group:'NF', cn:'主人公', traits:['感染力强','看人潜力','关怀照顾','组织安排']},
  ENFP:{group:'NF', cn:'竞选者', traits:['热情外放','创意发散','情感连接','自由灵活']},
  ISTJ:{group:'SJ', cn:'物流师', traits:['低调独处','务实细节','逻辑事实','秩序计划']},
  ISFJ:{group:'SJ', cn:'守卫者', traits:['安静社交','具体实际','照顾感受','稳定执行']},

function faceSVG(mood, ink){
  const L=86, R=114, ey=94;
  const hl = x => `<circle cx="${x+1.6}" cy="${ey-2.3}" r="1.5" fill="#fff"/>`;
  const brow = (d, op=.9) => `<path d="${d}" stroke="${ink}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="${op}"/>`;
  let eyes='', brows='', mouth='';
  switch(mood){
    case 'stern':
      eyes = `<ellipse cx="${L}" cy="${ey}" rx="4" ry="5" fill="${ink}"/>${hl(L)}<ellipse cx="${R}" cy="${ey}" rx="4" ry="5" fill="${ink}"/>${hl(R)}`;
      brows = brow(`M76 81 l16 5`) + brow(`M124 81 l-16 5`);
      mouth = `<path d="M93 113 h14" stroke="${ink}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
      break;
    case 'smirk':
      eyes = `<ellipse cx="${L}" cy="${ey}" rx="4.4" ry="5.6" fill="${ink}"/>${hl(L)}<ellipse cx="${R}" cy="${ey}" rx="4.4" ry="5.6" fill="${ink}"/>${hl(R)}`;
      brows = brow(`M76 80 q9 -2 16 0`) + brow(`M107 76 q9 -3 15 -5`);
      mouth = `<path d="M92 111 q9 6 16 -3" stroke="${ink}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
      break;
    case 'deep':
      eyes = `<path d="M80 93 h12" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M108 93 h12" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>
              <circle cx="86" cy="97.5" r="2.4" fill="${ink}"/><circle cx="114" cy="97.5" r="2.4" fill="${ink}"/>`;
      brows = brow(`M76 84 q9 -3 16 0`, .45) + brow(`M108 84 q9 -3 16 0`, .45);
      mouth = `<path d="M94 113 q6 3 12 0" stroke="${ink}" stroke-width="2.4" stroke-linecap="round" fill="none"/>`;
      break;
    case 'soft':
      eyes = `<path d="M80 94 q6 5 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M108 94 q6 5 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
      brows = brow(`M77 83 q8 -3 15 0`, .5) + brow(`M108 83 q8 -3 15 0`, .5);
      mouth = `<path d="M95 112 q5 4 10 0" stroke="${ink}" stroke-width="2.4" stroke-linecap="round" fill="none"/>`;
      break;
    case 'smile':
      eyes = `<path d="M80 96 q6 -7 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M108 96 q6 -7 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
      mouth = `<path d="M92 109 q8 9 16 0" stroke="${ink}" stroke-width="2.5" stroke-linecap="round" fill="none"/>`;
      break;
    case 'tongue':
      eyes = `<path d="M80 96 q6 -7 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M108 96 q6 -7 12 0" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
      mouth = `<path d="M91 107 q9 11 18 0 z" fill="${ink}"/>
               <path d="M97 112 q3 7 6 0 z" fill="#EF7F9A"/>`;
      break;
    case 'bright':
      eyes = `<ellipse cx="${L}" cy="${ey}" rx="5.4" ry="6.8" fill="${ink}"/>
              <circle cx="${L+2}" cy="${ey-2.8}" r="1.9" fill="#fff"/><circle cx="${L-1.6}" cy="${ey+2}" r="1" fill="#fff" opacity=".8"/>
              <ellipse cx="${R}" cy="${ey}" rx="5.4" ry="6.8" fill="${ink}"/>
              <circle cx="${R+2}" cy="${ey-2.8}" r="1.9" fill="#fff"/><circle cx="${R-1.6}" cy="${ey+2}" r="1" fill="#fff" opacity=".8"/>`;
      mouth = `<path d="M91 107 q9 11 18 0 q-9 5 -18 0 z" fill="${ink}"/>`;
      break;
    default: /* calm */

  }
  return eyes + brows + mouth;
}

}

function avatarSVG(type){
  const cfg = AV[type];
  const g = GROUPS[TYPES[type].group];
  const ink = '#16130f';
  const skin = cfg.skin || '#F6D2B6';
  const gc = cfg.body || g.color;
  const gcd = g.dark;
  const ac = g.color;
  const s = [];
  const add = x => { if(x) s.push(x); };

  /* 背后的光 */
  add(propSVG('rays', ac, gc, gcd, ink) && cfg.prop==='rays' ? propSVG('rays', ac, gc, gcd, ink) : '');
  if(cfg.prop === 'skateboard') add(propSVG('skateboard', ac, gc, gcd, ink));
  if(cfg.cloak){
    add(`<path d="M67 126 C51 152 46 200 50 216 L150 216 C154 200 149 152 133 126 Z"
      fill="${gcd}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`);
  }
  add(hairBack(cfg.hair, cfg.hairColor, ink));
  add(legsSVG(ink));

  /* 身体 */
  add(`<path d="M72 140 C72 129 80 122 90 120 L110 120 C120 122 128 129 128 140 L137 206 C138 214 132 218 125 218 L75 218 C68 218 62 214 63 206 Z"
    fill="${gc}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`);
  add(`<path d="M90 120 L100 138 L110 120" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`);
  add(`<path d="M100 138 L100 214" stroke="${ink}" stroke-width="2" opacity=".22"/>`);

  if(cfg.suit){
    add(`<path d="M88 121 L100 148 L112 121" fill="#F7F5EF" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`);
    add(`<path d="M100 138 l5 7 -5 24 -5 -24 z" fill="#B23A3A" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`);
  }
  if(cfg.ex === 'apron'){
    add(`<path d="M82 150 C82 145 87 143 91 143 L109 143 C113 143 118 145 118 150 L120 202 L80 202 Z"
      fill="#FFF6E8" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`);
    add(`<path d="M88 143 v-9 M112 143 v-9" stroke="${ink}" stroke-width="2.5"/>`);
  }

  add(armsSVG(cfg.arms, gc, skin, ink));

  /* 脖子与头 */
  add(`<rect x="92" y="110" width="16" height="14" rx="4" fill="${skin}" stroke="${ink}" stroke-width="3"/>`);
  add(`<circle cx="56" cy="92" r="8" fill="${skin}" stroke="${ink}" stroke-width="3"/>`);
  add(`<circle cx="144" cy="92" r="8" fill="${skin}" stroke="${ink}" stroke-width="3"/>`);
  add(`<circle cx="100" cy="88" r="44" fill="${skin}" stroke="${ink}" stroke-width="3"/>`);
  add(`<ellipse cx="74" cy="104" rx="8" ry="4" fill="${ac}" opacity=".3"/>`);
  add(`<ellipse cx="126" cy="104" rx="8" ry="4" fill="${ac}" opacity=".3"/>`);
  add(faceSVG(cfg.mood, ink));
  add(hairFront(cfg.hair, cfg.hairColor, ink));
  add(accessorySVG(cfg.ex, ac, gc, gcd, ink));

  /* 道具 */
  if(cfg.prop === 'heartCenter' || cfg.prop === 'trayCenter' || cfg.prop === 'mic' ||
     cfg.prop === 'brush' || cfg.prop === 'drill' || cfg.prop === 'folder'){
    add(propSVG(cfg.prop, ac, gc, gcd, ink));
  }
  if(cfg.prop === 'blueprint' || cfg.prop === 'megaphone' || cfg.prop === 'butterfly') add(propSVG(cfg.prop, ac, gc, gcd, ink));
  if(cfg.prop === 'gearTop' || cfg.prop === 'bulbTop' || cfg.prop === 'stars') add(propSVG(cfg.prop, ac, gc, gcd, ink));

  return `<svg viewBox="0 0 200 260" role="img" aria-label="${type}">${s.join('')}</svg>`;
}

/* =========================================================
   状态与渲染
   ========================================================= */
const $ = (sel, el=document) => el.querySelector(sel);
const state = { type:null, answers:[], q:0, busy:false };
const screens = { pick:$('#s-pick'), quiz:$('#s-quiz'), result:$('#s-result') };

function show(name){
  Object.values(screens).forEach(s=>s.classList.remove('on'));
  screens[name].classList.add('on');
  window.scrollTo({top:0, behavior:'auto'});
}
function applyGroup(key){
  const g = GROUPS[key];
  const r = document.documentElement.style;
  r.setProperty('--accent', g.color);
  r.setProperty('--accent-d', g.dark);
  r.setProperty('--tint', g.tint);
  r.setProperty('--on', g.on);
}

/* 选择页 */
function renderPicker(){
  $('#groups').innerHTML = Object.keys(GROUPS).map(k=>{
    const g = GROUPS[k];
    return `<div class="gblock" style="--g:${g.color};--tg:${g.tint};--og:${g.on}">
      <div class="ghead">
        <span class="gkey">${g.key}</span>
        <span class="gname">${g.cn}</span>
        <span class="gnote">${g.note}</span>
      </div>
      <div class="grid4">
        ${ORDER[k].map(t=>`
          <button class="tcard" data-type="${t}" aria-label="选择 ${t}">
            ${avatarSVG(t)}
            <b class="tcode">${t}</b>
            <span class="tnick">${AV[t].nick}</span>
            <span class="treal">${TYPES[t].cn}</span>
          </button>`).join('')}
      </div>
    </div>`;
  }).join('');
  $('#groups').querySelectorAll('.tcard').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const type = btn.dataset.type;
      applyGroup(TYPES[type].group);
      startQuiz(type);
    });
  });
}

/* 答题 */
function startQuiz(type){
  state.type = type;
  state.answers = [];
  state.q = 0;
  show('quiz');
  renderQuestion();
}
function renderQuestion(){
  const i = state.q, q = QUESTIONS[i];
  $('#qCount').textContent = String(i+1).padStart(2,'0') + ' / ' + String(QUESTIONS.length).padStart(2,'0');
  $('#qBar').style.width = (i / QUESTIONS.length * 100) + '%';
  $('#qNo').textContent = 'QUESTION ' + String(i+1).padStart(2,'0');
  $('#qTitle').textContent = q.q;
  $('#qOpts').innerHTML = ['A','B','C','D'].map((L,idx)=>`
    <button class="opt" data-i="${idx}">
      <span class="ob">${L}</span>
      <span>${q.o[idx]}</span>
    </button>`).join('');
  $('#qOpts').querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>choose(parseInt(btn.dataset.i,10), btn));
  });
}
function choose(idx, btn){
  if(state.busy) return;
  state.busy = true;
  btn.classList.add('sel');
  state.answers[state.q] = ['A','B','C','D'][idx];
  setTimeout(()=>{
    state.busy = false;
    if(state.q < QUESTIONS.length - 1){
      state.q++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      $('#qBar').style.width = '100%';
      finish();
    }
  }, 250);
}

/* 计分 */
function computeResult(){
  const type = state.type;
  const letters = type.split('');
  const dims = DIMS.map(d=>{
    const letter = letters[d.letterIdx];
    const map = SCORE_MAP[d.key][letter];
    const scores = d.qs.map(qi=>{
      const ai = ['A','B','C','D'].indexOf(state.answers[qi]);
      return map[ai];
    });
    const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
    const level = Math.min(3, Math.max(0, Math.round(avg)));
    return {
      letter, key:d.key, level,
      name: STATUS[level].name,
      short: STATUS[level].short,
      suffix: STATUS[level].suffix,
      trait: TYPES[type].traits[d.letterIdx]
    };
  });

  const level10 = ['A','B','C','D'].indexOf(state.answers[9] || 'A');
  const X = dims.filter(d=>d.level===0).length;
  const Y = dims.filter(d=>d.level===1).length;
  const Z = dims.filter(d=>d.level===2).length;
  const W = dims.filter(d=>d.level===3).length;

  let version;
  if(W === 0 && Z === 0) version = '精装正版';
  else if(W >= 2 || (W === 1 && level10 === 3)) version = '盗版预警';
  else if(W === 1 && X >= 2) version = '翻新版';
  else if(Z + W >= 2 && X >= 1) version = '组装机';
  else if(Z >= 1 && W === 0) version = '拼多多版';
  else version = W > 0 ? '盗版预警' : (Z > 0 ? '拼多多版' : '精装正版');

  return {type, dims, X, Y, Z, W, level10, version};
}

/* 结果 */
function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '.' + p(d.getMonth()+1) + '.' + p(d.getDate());
}
function renderResult(r){
  const {type, dims, X, Y, Z, W, version} = r;
  const g = GROUPS[TYPES[type].group];
  const nick = AV[type].nick;
  applyGroup(g.key);

  const serial = 'QC-' + type + '-' + String(Math.floor(Math.random()*9000)+1000);
  const dateStr = todayStr();
  const quote = QUOTES[type][version];
  const v = VERSIONS[version];
  const caption = `今日验货：${type}（${nick}）${version}。` + dims.map(d=>`${d.letter}${d.name}`).join('，') + '。';

  $('#resTitle').textContent = `你的 ${type} 是 ${version}`;
  $('#posters').innerHTML = `
    <article class="poster hero">
      <div class="hero-band">
        <div class="hero-top">
          <span class="mono">QC · ${g.key} / ${serial}</span>
          <span class="mono">${dateStr}</span>
        </div>
        <div class="hero-row">
          <div>
            <div class="hero-code">${type}</div>
            <div class="hero-sub">${nick} · ${g.key} ${g.cn}</div>
          </div>
          <div class="hero-fig">${avatarSVG(type)}</div>
        </div>
      </div>
      <div class="hero-ver">
        <p class="hero-pre">你的 ${type} 是</p>
        <div class="hero-line">
          <h2 class="hero-name"><mark>${version}</mark></h2>
          <div class="stamp">已验货<small>QC PASS</small></div>
        </div>
        <p class="hero-def">${v.def}</p>
      </div>
      <blockquote class="hero-quote">“${quote}”</blockquote>
      <div class="hero-foot"><div class="barcode"></div></div>
    </article>

    <article class="poster">
      <div class="phead"><span class="eyebrow">02 / 四维验货表</span><span class="mono">FOUR CHECKS</span></div>
      <div class="dim-list">
        ${dims.map(d=>`
          <div class="dim-row">
            <div class="dim-letter">${d.letter}</div>
            <div class="dim-main">
              <div class="dim-line">
                <span class="dim-name">${d.trait}</span>
                <span class="pill lv${d.level}">${d.name}</span>
              </div>
              <p class="dim-diag">${d.suffix}</p>
              <div class="dim-bar">${[0,1,2,3].map(n=>`<i class="${n===d.level?'on':''}"></i>`).join('')}</div>
            </div>
          </div>`).join('')}
      </div>
      <p class="conclusion">结论：你的 ${type}，四个字母里 <span class="nw"><b>${X}</b> 个原装</span>，<span class="nw"><b>${Y}</b> 个半原装</span>，<span class="nw"><b>${Z}</b> 个虚标</span>，<span class="nw"><b>${W}</b> 个已经找不到出厂设置</span>。</p>
    </article>

    <article class="poster dark">
      <div class="phead"><span class="eyebrow">03 / 清醒洞察</span><span class="mono">${v.code}</span></div>
      <p class="insight">${v.insight}</p>
      <div class="dark-foot"><span>${type} / ${version}</span><span>${dateStr}</span></div>
    </article>

    <article class="poster">
      <div class="phead"><span class="eyebrow">04 / 截图配文</span><span class="mono">SHARE</span></div>
      <p class="cap-text">“${caption}”</p>
      <div class="actions">
        <button class="btn" id="againBtn">重新验货</button>
        <button class="btn btn-primary" id="copyBtn">复制配文</button>
      </div>
      <p class="cap-hint">四屏可直接截图 · 建议按顺序发</p>
    </article>
  `;

  $('#copyBtn').addEventListener('click', ()=>copyText(caption));
  $('#againBtn').addEventListener('click', reset);
  show('result');
}

function finish(){
  state.busy = true;
  const scan = $('#scan');
  $('#scanFig').innerHTML = avatarSVG(state.type);
  scan.classList.add('on');
  scan.setAttribute('aria-hidden','false');
  setTimeout(()=>{
    const r = computeResult();
    renderResult(r);
    scan.classList.remove('on');
    scan.setAttribute('aria-hidden','true');
    state.busy = false;
  }, 1250);
}

function reset(){
  state.type = null;
  state.answers = [];
  state.q = 0;
  applyGroup('NT');
  show('pick');
}

/* 复制 */
function copyText(text){
  const done = ()=>toast('已复制 · 可以直接发');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 1700);
}

/* 事件 */
$('#quitBtn').addEventListener('click', reset);
document.addEventListener('keydown', e=>{
  if(!screens.quiz.classList.contains('on')) return;
  const k = e.key.toUpperCase();
  if(['A','B','C','D'].includes(k)){
    const idx = ['A','B','C','D'].indexOf(k);
    const btn = document.querySelector(`.opt[data-i="${idx}"]`);
    if(btn) choose(idx, btn);
  }
});

/* 启动 */
renderPicker();
applyGroup('NT');
</script>
